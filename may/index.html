<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juna's Research Progress Dashboard — May 2026</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
<div class="header-row">
        <div class="header-text">
          <h1>Juna's Research Progress Dashboard &middot; May 2026</h1>
          <p class="header-desc">
            Tracking monthly goals, tasks, completion criteria, and outputs.
          </p>
        </div>
        <div class="header-progress">
          <p class="progress-label">Overall Progress</p>
          <div class="progress-track">
            <div class="progress-fill" id="overall-bar"></div>
          </div>
          <p class="progress-stat" id="overall-stat">0 / 0 completed</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container" id="dashboard">
    <!-- Rendered by script.js -->
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Changes are saved automatically in your browser.</span>
      <button class="btn-reset" onclick="resetAllData()">Reset All Progress</button>
    </div>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
